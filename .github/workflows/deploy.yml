name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      # Node is needed because the build runs the Tailwind CLI to compile app.css
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Publish (compiles Tailwind + Blazor WASM to static files)
        run: dotnet publish src/DoWellToDoGood/DoWellToDoGood.csproj -c Release -o release

      # GitHub project Pages serve from /<repo>/, so the base href must match
      - name: Set base href for project Pages
        run: sed -i 's|<base href="/" />|<base href="/do-well-to-do-good/" />|' release/wwwroot/index.html

      # Cache-bust the stylesheet: app.css ships under a stable name, so browsers
      # and the Pages CDN keep serving the old copy after a deploy. Stamp a
      # content hash onto the link so each change is a fresh URL. Runs before the
      # 404 copy below so the fallback page gets the same busted link.
      - name: Cache-bust app.css
        run: |
          hash=$(md5sum release/wwwroot/css/app.css | cut -c1-10)
          sed -i "s|css/app.css|css/app.css?v=$hash|g" release/wwwroot/index.html
          echo "Stamped app.css?v=$hash"

      # Same problem for our hand-written JS (stable names, CDN-cached). Stamp a
      # content hash so an updated crypto.js/theme.js/wheel.js is a fresh URL and
      # never served stale after a deploy.
      - name: Cache-bust app JS
        run: |
          for f in crypto theme wheel; do
            hash=$(md5sum release/wwwroot/js/$f.js | cut -c1-10)
            sed -i "s|js/$f.js|js/$f.js?v=$hash|g" release/wwwroot/index.html
            echo "Stamped $f.js?v=$hash"
          done

      # Client-side routing fallback: serve the app for unknown paths / deep links
      - name: Add SPA 404 fallback
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      # Stop Jekyll from deleting Blazor's _framework folder (starts with "_")
      - name: Disable Jekyll
        run: touch release/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
